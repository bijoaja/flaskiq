[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B904", # raise ... from err in exception handlers
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B104"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "config",
    "utils.*",
    "app.model.*",
    "app.repository.*",
    "app.service.view.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "app.service.agent.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "flask_limiter.*",
    "flask_cors.*",
    "flask_migrate.*",
    "flask_wtf.*",
    "flask_restful.*",
    "flask_swagger_ui.*",
]
ignore_missing_imports = true
